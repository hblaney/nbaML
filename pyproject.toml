[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-betting"
version = "0.1.0"
description = "NBA game-market pricing, edge finding, and walk-forward tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hblaney" }]
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "requests",
  "pydantic",
  "python-dotenv",
  "typer",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
nba-betting = "nba_betting.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
